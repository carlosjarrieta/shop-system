services:
  db_customers:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db_customers
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_customers:/var/lib/postgresql/data

  db_orders:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db_orders
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_orders:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_HOST: rabbitmq

volumes:
  postgres_data_customers:
  postgres_data_orders:
